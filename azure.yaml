# =============================================================================
# File: azure.yaml
# Purpose: Azure Developer CLI (azd) configuration for Dev Box Accelerator
# Description: Defines deployment hooks and environment setup for Linux/macOS
# =============================================================================
# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/refs/heads/main/schemas/v1.0/azure.yaml.json

# Project name used by azd for environment naming and resource tagging
name: ContosoDevExp

hooks:
  preprovision:
    posix:
      shell: sh
      continueOnError: false
      interactive: true
      run: |
        #!/bin/bash

        set -e 
        defaultPlatform="github"

        # Add a if statement to check if the environment variable is set
        if [ -z "${SOURCE_CONTROL_PLATFORM}" ]; then
            echo "SOURCE_CONTROL_PLATFORM is not set. Setting it to '${defaultPlatform}' by default."
            export SOURCE_CONTROL_PLATFORM="${SOURCE_CONTROL_PLATFORM:-${defaultPlatform}}"
        else
            echo "Existing SOURCE_CONTROL_PLATFORM is set to '${SOURCE_CONTROL_PLATFORM}'."
        fi      
        ./setUp.sh -e ${AZURE_ENV_NAME} -s ${SOURCE_CONTROL_PLATFORM}
    windows:
      shell: pwsh
      continueOnError: false
      interactive: true
      run: |
        # PowerShell preprovision script
        $ErrorActionPreference = 'Stop'
        $defaultPlatform = 'github'

        if (-not $env:SOURCE_CONTROL_PLATFORM -or $env:SOURCE_CONTROL_PLATFORM -eq '') {
            Write-Output "SOURCE_CONTROL_PLATFORM is not set. Setting it to '$defaultPlatform' by default."
            $env:SOURCE_CONTROL_PLATFORM = $defaultPlatform
        } else {
            Write-Output "Existing SOURCE_CONTROL_PLATFORM is set to '$($env:SOURCE_CONTROL_PLATFORM)'."
        }

        # Run setUp.sh (use bash if available)
        if (Get-Command bash -ErrorAction SilentlyContinue) {
            & bash -c "./setUp.sh -e $env:AZURE_ENV_NAME -s $env:SOURCE_CONTROL_PLATFORM"
        } else {
            Write-Output "bash not found; attempting to execute ./setUp.sh directly"
            & ./setUp.sh -e $env:AZURE_ENV_NAME -s $env:SOURCE_CONTROL_PLATFORM
        }

  # Post-provision: configure Windows 365 Cloud PCs via Microsoft Graph for any
  # project with platforms.cloudPc.enable = true. Non-fatal (continueOnError) so
  # a missing Windows 365 license or Graph consent does not fail `azd up`.
  postprovision:
    posix:
      shell: sh
      continueOnError: true
      interactive: true
      run: |
        #!/bin/bash
        set -e
        if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -File ./scripts/Configure-Windows365.ps1
        else
            echo "pwsh (PowerShell 7+) not found; skipping Windows 365 Cloud PC configuration."
            echo "Install PowerShell 7 and run: pwsh -File ./scripts/Configure-Windows365.ps1"
        fi
    windows:
      shell: pwsh
      continueOnError: true
      interactive: true
      run: |
        $ErrorActionPreference = 'Stop'
        ./scripts/Configure-Windows365.ps1
